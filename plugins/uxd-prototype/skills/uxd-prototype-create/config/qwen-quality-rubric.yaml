version: 1.0.0
connection: Qwen3.8
model: Qwen3.8-27B
prompt: |
  You are judging the contract quality of a sanitized prototype create-serve result.

  Response:
  {{output}}

  Score the output 0 to 100 on:
  - Required fields: status, phase, server_type, http_status,
    journey_http_status, model_invoked, and llm_cost_usd
  - Internal consistency: completed create-serve status and a recognized server type
  - Readiness: root and journey HTTP statuses are successful
  - Cost integrity: model_invoked is false and llm_cost_usd is zero

  Return a single integer from 0 to 100. Number only, with no reasoning or units.
  Use only the Response; do not infer prototype content or visual quality.
output:
  quality_score: 0_to_100
  verdict:
    pass_min: 80
    review_min: 40
    fail_min: 0
