name: uxd-evaluator-data-flow-qwen-v1
version: 1.0.0
connection: Qwen3.8
model: Qwen3.8-27B
target:
  observations:
    - eval-data-flow-audit
  required_tag_prefix: audit_type=
  metadata:
    audit_type: evaluator-pipeline-data-flow
    privacy_mode: sanitized_artifact_output
    data_flow_judge_eligible: true
input_mapping:
  output: "{{output}}"
prompt_output_contract: Return only one integer from 0 to 100; put evidence and dimension rationale in the score-reasoning channel.
rubric_file: data-flow-judge-rubric.yaml
score_names:
  data_flow_integrity_score: uxd-evaluator-data-flow-qwen-v1
budget:
  max_output_tokens: 1200
privacy:
  screenshots: false
  binary_data: false
  jira_content: false
  prototype_source: false
  prompt_content: false
reporting:
  verdict_thresholds: data-flow-judge-rubric.yaml#scoring.verdicts
  missing_or_invalid_manifest: fail_closed
run_state:
  required_observation: eval-data-flow-audit
  current_pipeline_support: sanitized_manifest_observation_emitted
  enablement: >-
    Target the sanitized manifest output on eval-data-flow-audit only. Do not attach the judge to ordinary
    model-phase output; those observations lack full artifact lineage.
