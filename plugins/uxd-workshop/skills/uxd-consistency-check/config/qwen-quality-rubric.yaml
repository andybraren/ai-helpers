version: 1.0.0
connection: Qwen3.8
model: Qwen3.8-27B
prompt: |
  You are judging the contract quality of a sanitized UX consistency-check summary.

  Response:
  {{output}}

  Score the output 0 to 100 on:
  - Required fields: status, mode, total_guidelines_checked, violation_groups,
    warning_groups, passes, and model_invoked
  - Internal arithmetic: violation_groups + warning_groups + passes equals
    total_guidelines_checked
  - Valid values: non-negative counts, status completed, mode source, and
    model_invoked false
  - Clear distinction between violations, warnings, and passes

  Return a single integer from 0 to 100. Number only, with no reasoning or units.
  Use only the Response; do not infer source findings or visual quality.
output:
  quality_score: 0_to_100
  verdict:
    pass_min: 80
    review_min: 40
    fail_min: 0
